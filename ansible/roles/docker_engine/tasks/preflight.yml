---
- name: Require an explicitly supported Docker host
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version == '24.04')
        or (ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version | int == 9)
      - ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: Docker automation supports Ubuntu 24.04 LTS and Enterprise Linux 9 on x86_64 or aarch64.

- name: Detect legacy Docker APT source files on Ubuntu
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: docker*.list
    file_type: file
  register: docker_legacy_apt_sources
  when: ansible_facts.distribution == 'Ubuntu'

- name: Require migration of legacy Docker APT sources before scoped trust changes
  ansible.builtin.assert:
    that:
      - docker_legacy_apt_sources.matched == 0
    fail_msg: >-
      Legacy Docker .list sources exist. Back them up and migrate their approved
      settings to this role before deployment to avoid conflicting Signed-By values.
  when: ansible_facts.distribution == 'Ubuntu'
