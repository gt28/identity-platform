---
docker_repository_base_url: "https://download.docker.com/linux/{{ 'ubuntu' if ansible_facts.distribution == 'Ubuntu' else 'centos' }}"
docker_gpg_key_url: "{{ docker_repository_base_url }}/gpg"
docker_gpg_fingerprint: >-
  {{ '9DC858229FC7DD38854AE2D88D81803C0EBFCD88' if ansible_facts.distribution == 'Ubuntu'
  else '060A61C51B558A7F742B77AAC52FEB6B621E9F35' }}
docker_remove_conflicting_packages: false
docker_compose_min_version: 2.18.0
docker_packages:
  - containerd.io
  - docker-buildx-plugin
  - docker-ce
  - docker-ce-cli
  - docker-compose-plugin
docker_users: []
docker_log_max_size: 20m
docker_log_max_files: "5"
