name: Identity Platform CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  identity-platform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible/requirements-controller.txt
      - name: Install controller and collections
        run: |
          python -m pip install --requirement requirements-controller.txt
          ansible-galaxy collection install --requirements-file requirements.yml --collections-path .collections
      - name: Validate identity playbooks
        run: |
          ansible-playbook --syntax-check playbooks/preflight.yml
          ansible-playbook --syntax-check playbooks/site.yml
          ansible-playbook --syntax-check playbooks/demo_company.yml
          ansible-playbook --syntax-check playbooks/verify.yml
          ansible-playbook --syntax-check -i tests/smoke-inventory.yml tests/smoke-user.yml
      - name: Test compatibility contracts and Compose rendering
        run: python -m unittest discover -s tests -v
      - name: Lint identity automation
        run: ansible-lint --profile production playbooks roles tests/*.yml inventories/ubuntu
